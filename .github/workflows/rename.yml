name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename to index.html
        run: |
          git config user.name "kings-hauling"
          git config user.email "kings-hauling@users.noreply.github.com"
          git mv monsutazhan-i.html index.html
          git commit -m "Rename monsutazhan-i.html to index.html"
          git push
